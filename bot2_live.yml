name: Bot2 Live (ICT-SMC v2 -> Tabdeal)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"   # هر ۱۵ دقیقه — با TABDEAL_DRY_RUN=true کاملاً بی‌خطره (سفارش واقعی ثبت نمی‌شه)

permissions:
  contents: write

concurrency:
  group: bot2-live-tabdeal
  cancel-in-progress: false

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot2 live trader
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TABDEAL_DRY_RUN: ${{ vars.TABDEAL_DRY_RUN }}
          TABDEAL_HARD_CAP_MARGIN_IRT: ${{ vars.TABDEAL_HARD_CAP_MARGIN_IRT }}
          BOT2_MARGIN_IRT: ${{ vars.BOT2_MARGIN_IRT }}
          BOT2_LEVERAGE: ${{ vars.BOT2_LEVERAGE }}
          PAPER_STARTING_BALANCE_IRT: ${{ vars.PAPER_STARTING_BALANCE_IRT }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ vars.TELEGRAM_CHAT_ID_2 }}
        run: python bot2_live/live_trader.py

      - name: Commit updated state and paper log
        run: |
          git config user.name "bot2-live"
          git config user.email "bot2-live@users.noreply.github.com"
          git add bot2_live/state.json bot2_live/paper_trades_log.csv
          if ! git diff --staged --quiet; then
            git commit -m "update bot2 state/paper log [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "تغییری در وضعیت نبود."
          fi
