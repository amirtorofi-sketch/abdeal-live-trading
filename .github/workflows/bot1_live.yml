name: Bot1 Live (Supertrend+ADX -> Tabdeal)

on:
  workflow_dispatch: {}
  # ⚠️ کرون داخلی گیت‌هاب حذف شد چون غیرقابل‌اعتماده. از cron-job.org استفاده کن:
  # POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/bot1_live.yml/dispatches
  # هدرها: Authorization: token <YOUR_GITHUB_PAT> و Accept: application/vnd.github+json
  # بادی: {"ref": "main"}

permissions:
  contents: write

concurrency:
  group: bot1-live-tabdeal
  cancel-in-progress: false

jobs:
  run-bot1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot1 live trader
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TABDEAL_DRY_RUN: ${{ vars.TABDEAL_DRY_RUN }}
          TABDEAL_HARD_CAP_MARGIN_IRT: ${{ vars.TABDEAL_HARD_CAP_MARGIN_IRT }}
          BOT1_MARGIN_IRT: ${{ vars.BOT1_MARGIN_IRT }}
          BOT1_LEVERAGE: ${{ vars.BOT1_LEVERAGE }}
          BOT1_SMC_MARGIN_IRT: ${{ vars.BOT1_SMC_MARGIN_IRT }}
          BOT1_SMC_LEVERAGE: ${{ vars.BOT1_SMC_LEVERAGE }}
          PAPER_STARTING_BALANCE_IRT: ${{ vars.PAPER_STARTING_BALANCE_IRT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python bot1_live/live_trader.py

      - name: Commit updated state and paper log
        env:
          PAPER_STARTING_BALANCE_IRT: ${{ vars.PAPER_STARTING_BALANCE_IRT }}
        run: |
          git config user.name "bot1-live"
          git config user.email "bot1-live@users.noreply.github.com"
          git add bot1_live/state.json
          [ -f bot1_live/paper_trades_log.csv ] && git add bot1_live/paper_trades_log.csv
          if ! git diff --staged --quiet; then
            git commit -m "update bot1 state/paper log [skip ci]"
          fi
          git pull --rebase origin main

          # --- لایه‌ی دوم دفاعی در برابر تریگر دوگانه‌ی بیرونی ---
          # اگه به هر دلیلی (مثلاً تریگر تکراری از سرویس کرون بیرونی) دو
          # اجرای هم‌زمان این ورک‌فلو باعث ثبت دوبار یه بستن پوزیشن شده
          # باشه، این اسکریپت درست همینجا (بعد از pull، قبل از push نهایی)
          # ردیف‌های تکراری رو حذف و موجودی رو از روی CSV پاک‌شده بازسازی
          # می‌کنه. اگه چیزی تکراری نبود، هیچ تغییری نمی‌ده (idempotent).
          python common/reconcile_ledger.py bot1_live --starting-balance "${PAPER_STARTING_BALANCE_IRT:-4000000}"

          git add bot1_live/state.json bot1_live/paper_trades_log.csv
          if ! git diff --staged --quiet; then
            git commit -m "reconcile bot1 ledger [skip ci]"
          fi
          git push
